name: ContentOS CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PNPM_VERSION: 10.32.1
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/contentos_test
  CONTENTOS_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/contentos_test
  STORAGE_ROOT: storage/ci
  # Use the apt-installed binaries explicitly. Relying on PATH can select an
  # unrelated legacy ffmpeg binary on hosted/self-hosted runners.
  FFMPEG_PATH: /usr/bin/ffmpeg
  FFPROBE_PATH: /usr/bin/ffprobe
  FFMPEG_FONT_FILE: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
      - run: /usr/bin/ffmpeg -hide_banner -encoders | grep -Eq '(^|[[:space:]])libx264([[:space:]]|$)' && /usr/bin/ffmpeg -hide_banner -encoders | grep -Eq '(^|[[:space:]])aac([[:space:]]|$)'
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm security:scan
      - run: pnpm typecheck

  tests:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contentos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d contentos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
      - run: /usr/bin/ffmpeg -hide_banner -encoders | grep -Eq '(^|[[:space:]])libx264([[:space:]]|$)' && /usr/bin/ffmpeg -hide_banner -encoders | grep -Eq '(^|[[:space:]])aac([[:space:]]|$)'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:migrations
      - name: pnpm test
        shell: bash
        run: |
          set +e
          pnpm test 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary=$(awk '/✖ failing tests:/{capture=1; next} capture {print}' test-output.log | head -c 6000 | tr '\n' ' ')
            echo "::error title=ContentOS test failures::$summary"
          fi
          exit "$status"

  web-build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web build

  browser-acceptance:
    runs-on: ubuntu-latest
    needs: tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contentos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d contentos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
      - run: /usr/bin/ffmpeg -hide_banner -encoders | grep -Eq '(^|[[:space:]])libx264([[:space:]]|$)' && /usr/bin/ffmpeg -hide_banner -encoders | grep -Eq '(^|[[:space:]])aac([[:space:]]|$)'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run browser acceptance
        shell: bash
        run: |
          set +e
          pnpm test:browser 2>&1 | tee browser-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary=$(tail -c 6000 browser-output.log | tr '\n' ' ')
            echo "::error title=ContentOS browser failures::$summary"
          fi
          exit "$status"
