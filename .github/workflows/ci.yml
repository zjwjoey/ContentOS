name: ContentOS CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PNPM_VERSION: 10.32.1
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/contentos_test
  CONTENTOS_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/contentos_test
  STORAGE_ROOT: storage/ci
  FFMPEG_PATH: ffmpeg
  FFPROBE_PATH: ffprobe
  FFMPEG_FONT_FILE: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm security:scan
      - run: pnpm typecheck

  tests:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contentos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d contentos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:migrations
      - run: pnpm test

  web-build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web build

  browser-acceptance:
    runs-on: ubuntu-latest
    needs: tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contentos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d contentos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
