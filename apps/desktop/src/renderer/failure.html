<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ContentOS startup</title><style>body{font:14px system-ui;background:#0f172a;color:#e2e8f0;margin:0;padding:32px}main{max-width:760px;margin:auto}pre{white-space:pre-wrap;background:#1e293b;padding:16px;border-radius:8px}button{padding:8px 14px;border:0;border-radius:6px;background:#38bdf8;color:#082f49;cursor:pointer;margin-right:8px}</style></head><body><main><h1>ContentOS could not start</h1><p id="summary">The local runtime is unavailable.</p><pre id="details"></pre><button id="retry">Retry</button><button id="doctor">Run diagnostics</button></main><script>const render=s=>{document.querySelector('#summary').textContent='Runtime: '+s.phase;document.querySelector('#details').textContent=s.error?JSON.stringify(s.error,null,2):'No error details.'};const api=window.contentosDesktop;api.getSnapshot().then(render);api.onStatus(render);document.querySelector('#retry').onclick=()=>api.start().then(render);document.querySelector('#doctor').onclick=()=>api.doctor().then(r=>{document.querySelector('#details').textContent=JSON.stringify(r,null,2)})</script></body></html>
