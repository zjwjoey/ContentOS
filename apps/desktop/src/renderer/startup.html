<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ContentOS</title><style>body{font:15px system-ui,-apple-system,"Segoe UI",sans-serif;background:#0f172a;color:#e2e8f0;margin:0;display:grid;place-items:center;height:100vh}main{width:min(620px,calc(100vw - 64px));background:#172554;border:1px solid #334155;border-radius:16px;padding:32px;box-shadow:0 20px 60px #02061799}h1{margin:0 0 8px;font-size:28px}p{color:#bfdbfe}.service{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #334155}.state{font-weight:600;color:#93c5fd}.ready{color:#86efac}.failed{color:#fca5a5}#hint{margin-top:22px;font-size:13px;color:#94a3b8}</style></head><body><main><h1>ContentOS</h1><p id="summary">正在启动本地服务…</p><section id="services"><div class="service"><span>Runtime</span><span class="state">STARTING</span></div></section><div id="hint">数据库、API、工作器和 Web 就绪后将自动进入工作台。</div></main><script>
const api=window.contentosDesktop;const summary=document.querySelector('#summary');const services=document.querySelector('#services');
const render=(snapshot)=>{summary.textContent=snapshot.error?.message||({STARTING:'正在启动本地服务…',READY:'正在进入工作台…',READY_WITH_WARNINGS:'正在进入工作台…',FAILED:'启动失败',STOPPING:'正在关闭本地服务…'}[snapshot.phase]||'正在检查本地服务…');const rows=snapshot.status?.services||[];services.innerHTML=rows.length?rows.map(item=>`<div class="service"><span>${item.label}</span><span class="state ${item.state==='READY'?'ready':item.state==='FAILED'?'failed':''}">${item.state}</span></div>`).join(''):'<div class="service"><span>Runtime</span><span class="state">STARTING</span></div>';};
api.getSnapshot().then(render);api.onStatus(render);
</script></body></html>
